# Conservation Laws
rule_id: EN-001
name: Energy conservation trigger domain
statement: "Energy conservation applies only when no nonconservative work is done."
trigger_domain:
  conditions:
    - "energy_conservation_attempted == true"
    - "nonconservative_work_present == false"
failure_domain:
  examples:
    - "Using energy conservation with friction present"
    - "Ignoring work done by external forces"
post_conditions:
  - "EnergyConservationCheck(pass)=true"
ops_template:
  - CheckNonConservativeWork()
verification:
  tests:
    - type: "symbolic_consistency"
    - type: "numeric_back_substitution"

---

rule_id: MO-001
name: Linear momentum conservation trigger domain
statement: "Linear momentum conservation requires zero net external force."
trigger_domain:
  conditions:
    - "momentum_conservation_attempted == true"
    - "net_external_force == 0"
failure_domain:
  examples:
    - "Conserving momentum when external force is present"
post_conditions:
  - "MomentumConservationCheck(pass)=true"
ops_template:
  - CheckNetExternalForce()
verification:
  tests:
    - type: "symbolic_consistency"

---

rule_id: AM-001
