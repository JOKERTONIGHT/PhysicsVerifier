    - "Taking limit incorrectly"
    - "Applying local approximation globally"
    - "Mixing local and global behavior without justification"
post_conditions:
  - "ConvergenceCheck(pass)=true AND LocalGlobalCheck(pass)=true"
ops_template:
  - CheckConvergence()
  - VerifyLocalVsGlobal()
verification:
  tests:
    - type: "symbolic_consistency"

