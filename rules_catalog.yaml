# Physics Problem-Solving Rules Catalog
# This file contains rule cards that can be used by a verification engine
# Rules are automatically appended by the rule_judge.py workflow

# Unit Rules
rule_id: UR-001
name: Unit consistency
statement: "All quantities must use consistent SI units, and numeric calculations should occur only at the final step."
trigger_domain:
  conditions:
    - "problem_has_units == true"
failure_domain:
  examples:
    - "Mixing cgs and SI units in the same calculation"
    - "Converting units mid-calculation instead of at the end"
post_conditions:
  - "All units consistent throughout calculation"
ops_template:
  - NormalizeUnits("SI")
  - ConstraintAdd("numeric_only_at_end")
verification:
  tests:
    - type: "symbolic_consistency"
    - type: "numeric_back_substitution"

---

rule_id: UR-002
name: Dimensionless function arguments
statement: "Functions expecting dimensionless arguments (sin, cos, log, exp) must receive dimensionless inputs."
trigger_domain:
  conditions:
    - "function_call_type in ['sin', 'cos', 'log', 'exp', 'ln']"
failure_domain:
  examples:
    - "sin(30 rad) without converting to dimensionless angle"
    - "log(5 kg) with dimensional argument"
post_conditions:
  - "All function arguments are dimensionless"
ops_template:
  - CheckDimensionlessArgs()
verification:
  tests:
    - type: "symbolic_consistency"

---

# Dimensional Analysis
rule_id: DA-001
name: Dimensional equivalence on every equality
statement: "Every equality must have dimensionally equivalent left and right sides."
trigger_domain:
  conditions:
    - "equality_present == true"
failure_domain:
  examples:
    - "F = ma where F has wrong dimensions"
    - "v = at² without checking dimensions"
post_conditions:
  - "DimensionCheck(pass)=true"
ops_template:
  - DimensionCheck()
verification:
  tests:
    - type: "symbolic_consistency"

