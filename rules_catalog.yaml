# Safe Divide
rule_id: SD-001
name: Safe divide
statement: "Never divide by quantities that can be zero or epsilon without guard/check first."
trigger_domain:
  conditions:
    - "division_operation_present == true"
failure_domain:
  examples:
    - "Dividing by velocity that could be zero"
    - "Dividing by sin(θ) when θ could be 0"
    - "Dividing by small quantities near zero without epsilon check"
post_conditions:
  - "SafeDivideCheck(pass)=true"
ops_template:
  - CheckDivisionByZero()
  - CheckDivisionByEpsilon()
verification:
  tests:
    - type: "symbolic_consistency"

