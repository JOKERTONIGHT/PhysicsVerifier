failure_domain:
  examples:
    - "Mixing velocities from different reference frames"
    - "Adding velocities incorrectly (not using relativistic addition when needed)"
post_conditions:
  - "FrameConsistencyCheck(pass)=true"
ops_template:
  - DeclareInertialFrame()
  - CheckFrameConsistency()
verification:
  tests:
    - type: "symbolic_consistency"

