# Approximations
rule_id: AP-001
name: Small-angle approximation domain + posterior consistency
statement: "Small-angle approximations (sin θ ≈ θ, cos θ ≈ 1) require θ << 1 rad and posterior verification."
trigger_domain:
  conditions:
    - "small_angle_approximation_used == true"
    - "angle << 1 (radians)"
failure_domain:
  examples:
    - "sin(30°) ≈ 30° (should use radians: 0.524 rad)"
    - "Using approximation for large angles"
post_conditions:
  - "SmallAngleCheck(pass)=true AND PosteriorCheck(pass)=true"
ops_template:
  - CheckSmallAngleCondition()
  - VerifyPosteriorConsistency()
verification:
  tests:
    - type: "symbolic_consistency"
    - type: "numeric_back_substitution"

