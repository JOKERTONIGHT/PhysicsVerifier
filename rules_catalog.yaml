# Root Selection
rule_id: SE-001
name: Physical root selection / domain filter
statement: "When solving equations with multiple roots, select only physically meaningful solutions."
trigger_domain:
  conditions:
    - "quadratic_or_higher_order_equation == true"
    - "multiple_roots_found == true"
failure_domain:
  examples:
    - "Accepting negative distance as solution"
    - "Using negative time as valid answer"
post_conditions:
  - "PhysicalRootSelected(pass)=true"
ops_template:
  - FilterPhysicalRoots()
verification:
  tests:
    - type: "symbolic_consistency"

